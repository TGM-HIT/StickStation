name: macOS

# Builds the macOS app and uploads it as the "StickStation-macOS" artifact.
# Releases are published by release.yaml, which calls this workflow.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Expected a release tag like v1.2.3, got %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build StickStation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild -version
          xcodebuild \
            -project macos/StickStation.xcodeproj \
            -scheme StickStation \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/stickstation-build" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            "MARKETING_VERSION=$VERSION" \
            build

          plist="$RUNNER_TEMP/stickstation-build/Build/Products/Release/StickStation.app/Contents/Info.plist"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          if [[ "$actual_version" != "$VERSION" ]]; then
            printf 'Expected app version %s, found %s\n' "$VERSION" "$actual_version" >&2
            exit 1
          fi

      - name: Package macOS app
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="$RUNNER_TEMP/stickstation-build/Build/Products/Release/StickStation.app"
          archive="$GITHUB_WORKSPACE/dist/StickStation-macOS-v${VERSION}.zip"

          if [[ ! -f "$app/Contents/Info.plist" ]]; then
            printf 'Expected app bundle at %s\n' "$app" >&2
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --keepParent "$app" "$archive"
          unzip -tq "$archive"
          (cd "$GITHUB_WORKSPACE/dist" && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: StickStation-macOS
          path: dist/*
          if-no-files-found: error
