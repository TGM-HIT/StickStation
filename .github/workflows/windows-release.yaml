name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows-release.yaml"]
    tags: ["v*"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows-release.yaml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test core library
        run: dotnet test windows/StickStation.Core.Tests -c Release

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            throw "Tag $env:GITHUB_REF is not of the form vX.Y.Z"
          } else {
            $version = '0.0.0'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained app (unpackaged)
        run: >
          dotnet publish windows/StickStation.App/StickStation.csproj
          -c Release -p:Platform=x64 -r win-x64 --self-contained
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Create zip and checksum
        shell: pwsh
        run: |
          $name = "StickStation-Windows-x64-v${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path publish\* -DestinationPath $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  $name" | Set-Content "$name.sha256"
          "ASSET=$name" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: StickStation-Windows-x64
          path: |
            StickStation-Windows-x64-*.zip
            StickStation-Windows-x64-*.zip.sha256

      # The macOS workflow (release-macos.yaml) creates the GitHub Release for the same tag;
      # wait for it and attach the Windows build, or create the release if it never appears.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $found = $false
          for ($i = 0; $i -lt 30 -and -not $found; $i++) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) { $found = $true } else { Start-Sleep -Seconds 30 }
          }
          if (-not $found) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          }
          gh release upload $tag $env:ASSET "$env:ASSET.sha256" --repo $env:GITHUB_REPOSITORY --clobber
